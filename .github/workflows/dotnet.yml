name: Build and Test

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore RaceDay_Api.sln

      - name: Build
        run: dotnet build RaceDay_Api.sln --configuration Release --no-restore

      - name: Run tests
        run: dotnet test RaceDay_Api.sln --configuration Release --no-build --verbosity normal
